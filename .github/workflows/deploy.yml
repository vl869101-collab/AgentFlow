name: Deploy

# Runs after a successful CI run on main (pushes only) or manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN          – vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID         – vercel.com → Team Settings → General → Vercel ID
#   VERCEL_PROJECT_ID     – dashboard.vercel.com → AgentFlow Web → Settings → Project ID
#   RAILWAY_TOKEN         – railway.app → Account Settings → Tokens
#
# Vercel project: set Root Directory to `apps/web` and the production domain.
# Railway service: uses the root `railway.json` (Docker build of apps/api).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy web (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy to Railway
        run: railway up --service agentflow-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── Render alternative ────────────────────────────────────────────────
  # The API can also run on Render instead of Railway:
  #   1. New → Web Service → connect this repo
  #   2. Root Directory: .   Dockerfile path: apps/api/Dockerfile
  #   3. Health check path: /health
  #   4. Add DATABASE_URL, JWT_SECRET, CREDENTIAL_ENCRYPTION_KEY (+ optional vars)
  #   5. For CI-triggered deploys add a RENDER_DEPLOY_HOOK secret and replace the
  #      Railway step with:
  #        curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
